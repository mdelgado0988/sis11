nonTechnicalPremium: 0
Calculations:  
  - name: calc
    formula: |
      //block
      const n2 = value => Number(Number(value || 0).toFixed(2));
      
      const resultado = { resto: (_pol.productCode == 'FRAUDE' && _cov.code == '110' ? 1000000 : 500000) };

      resultado.primaTecnica = n2(_cov.premium);
      const resto = resultado.resto;
      resultado.suma = n2(context.cov.limit);
      resultado.prima = n2(context.cov.premium);
      resultado.sumaDistribuye = n2(Math.min(resultado.suma, resto));
      resultado.proporcionDistribuye = (resultado.sumaDistribuye / resultado.suma);
      resultado.primaDistribuye = n2(resultado.proporcionDistribuye * resultado.primaTecnica);
      resultado.re = n2(resultado.sumaDistribuye * 0.50);
      resultado.ced = n2(resultado.sumaDistribuye - resultado.re);      

      //calculos finales
      resultado.cedantPremium = n2(resultado.primaDistribuye * 0.35);
      resultado.reinsurerPremium = n2(resultado.primaDistribuye - (resultado.cedantPremium));

      resultado.sumaFac = n2(resultado.suma - resultado.sumaDistribuye);
      resultado.primaFac = n2(resultado.primaTecnica - (resultado.cedantPremium + resultado.reinsurerPremium));

      //doCmd({cmd: "GetPing", data: {resultado: resultado}});
      
      return resultado
Lines:
  - ced: _calc.ced;
    re: _calc.re;
    cedantPremium: _calc.cedantPremium;
    reinsurerPremium: _calc.reinsurerPremium;
    commission: 0
    id: Cuota Parte

  - condition: _calc.sumaFac != 0
    ced: 0;
    re: _calc.sumaFac
    cedantPremium: 0;
    reinsurerPremium: _calc.primaFac
    #commission: Math.round((((_rsi / _insuredSum) * (_cov.premium * 0.9) * 0.30) * 100)) / 100;
    tax: 0
    id: FAC
