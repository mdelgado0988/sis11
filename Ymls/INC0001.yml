Rules:
  - condition: /*block*/ doCmd({cmd:'ExeChain',data:{chain:'cmdRenewalKeepRestructuredPlanAxx1083',context:'{id:'+_pol.id+'}'}}); ExeChain.ok && !!ExeChain.outData && ExeChain.outData.ok === true
    extraContext: chain cmdRenewalKeepRestructuredPlanAxx1083 {id:_pol.id}
    name: AXX-1083 Keep Restructured Plan On Renewal
    defaultInstallments: Number(_extra.installments)
    Detail:
      - condition: 1==1
        amount: "/*block*/ const n2 = (value) => Number(Number(value).toFixed(2)); const n = Number(_extra.installments); const per = n2(_pol.tax / n); const imp = _installment.numberInYear >= n ? n2(_pol.tax - per * (n - 1)) : per; n2(_installment.minimum - imp);"
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Prima Cobertura'"
        order: _lineNumber
      - condition: 1==1
        amount: "/*block*/ const n2 = (value) => Number(Number(value).toFixed(2)); const n = Number(_extra.installments); const per = n2(_pol.tax / n); _installment.numberInYear >= n ? n2(_pol.tax - per * (n - 1)) : per;"
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Impuesto de Seguros'"
        order: _lineNumber
  - condition: /*block*/ doCmd({cmd:'ExeChain',data:{chain:'cmdGetReferedOptions',context:'{id:'+_pol.id+'}'}}); ExeChain.ok && ExeChain.outData.ok
    extraContext: chain cmdGetReferedOptions {id:_pol.id}
    name: Automatic Installment
    defaultInstallments: Number(_extra?.installments ?? 12)
    defaultPremiumPeriodicity: _extra?.paymentFrequency ?? 'm'
    defaultPaymentMethod: _pol.paymentMethod || 'PRO'
    payPlanStartsAfterDays: _extra?.payPlanStartsAfterDays ?? 0
    Detail:
      - condition: 1==1
        amount: _installment.minimum - _extra.tax
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Prima Cobertura'"
        order: _lineNumber
      - condition: 1==1
        amount: _extra.tax
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Impuesto de Seguros'"
        order: _lineNumber      
    
  - condition: _pol.periodicity=="m"
    name: "12 Installments / Monthly"
    dueDaysFirstInstallment: 0
    maxInstallments: 12
    defaultInstallments: 12
    defaultPremiumPeriodicity: "m"
    Detail:
    
      - condition: _installment.numberInYear < 12
        amount: |
          /*block*/           
          const n2 = (value) => Number(value.toFixed(2));
          doCmd({cmd:'ExeChain', data:{chain:'cmdGetModalPremiumCoverageInstallment', context:'{policyId:'+ _pol.id +',anualPremium:'+ _pol.anualPremium +',frequency:"' + _pol.periodicity + '"}'}}); 
          const prima = n2(ExeChain.outData);
          const impuesto = n2(_pol.tax/12);
          const cuota = _installment.minimum;
          const diferencia = n2(cuota - (prima + impuesto));

          //doCmd({cmd :"GetPing", data: { Cuotas: _installment, prima: prima, impuesto: impuesto, diferencia: diferencia, totalCuota: n2(prima + impuesto + diferencia) }});
          
          n2(prima + diferencia);
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Prima Cobertura'"
        order: _lineNumber
        
      - condition: _installment.numberInYear < 12
        amount: |
          /*block*/
          const n2 = (value) => Number(value.toFixed(2));
          n2(_pol.tax/12);
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Impuesto de Seguros'"
        order: _lineNumber
        
      - condition: _installment.numberInYear==12
        amount: |
          /*block*/           
          const n2 = (value) => Number(value.toFixed(2));
          doCmd({cmd:'ExeChain', data:{chain:'cmdGetModalPremiumCoverageInstallment', context:'{policyId:'+ _pol.id +',anualPremium:'+ _pol.anualPremium +',frequency:"' + _pol.periodicity + '",isPremiumFactor:true}'}});
          const prima = n2(ExeChain.outData);
          const impuesto = n2(n2(_pol.tax / 12) + (_pol.tax - (n2(_pol.tax / 12) * 12)));
          const cuota = _installment.minimum;
          const diferencia = n2(cuota - (prima + impuesto));

          //doCmd({cmd :"GetPing", data: { Cuotas: _installment, prima: prima, impuesto: impuesto, diferencia: diferencia, totalCuota: n2(prima + impuesto + diferencia) }});
          
          n2(prima + diferencia);
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Prima Cobertura'"
        order: _lineNumber
      - condition: _installment.numberInYear==12
        amount: |
          /*block*/           
          const n2 = (value) => Number(value.toFixed(2));
          const impuesto = n2(n2(_pol.tax / 12) + (_pol.tax - (n2(_pol.tax / 12) * 12)));
          impuesto
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Impuesto de Seguros'"
        order: _lineNumber
  - condition: _pol.periodicity=="q" || _pol.periodicity=="t"
    name: 4 Installments / Quarterly
    dueDaysFirstInstallment: 0
    maxInstallments: 4
    defaultInstallments: 4
    defaultPremiumPeriodicity: q
    Detail:
      - condition: _installment.numberInYear < 4
        amount: /*block*/ doCmd({cmd:'ExeChain', data:{chain:'cmdGetModalPremiumCoverageInstallment', context:'{policyId:'+ _pol.id +',anualPremium:'+ _pol.anualPremium +',frequency:"' + _pol.periodicity + '"}'}}); Math.round(ExeChain.outData*100)/100;
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Prima Cobertura'"
        order: _lineNumber
      - condition: _installment.numberInYear < 4
        amount: Math.round(_pol.tax/4*100)/100;
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Impuesto de Seguros'"
        order: _lineNumber
      - condition: _installment.numberInYear == 4
        amount: /*block*/ doCmd({cmd:'ExeChain', data:{chain:'cmdGetModalPremiumCoverageInstallment', context:'{policyId:'+ _pol.id +',anualPremium:'+ _pol.anualPremium +',frequency:"' + _pol.periodicity + '", isPremiumFactor:true}'}}); Math.round(ExeChain.outData*100)/100;
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Prima Cobertura'"
        order: _lineNumber
      - condition: _installment.numberInYear == 4
        amount: Math.round(((Math.round(_pol.tax/4*100)/100)+(_pol.tax-((Math.round(_pol.tax/4*100)/100)*4)))*100)/100;
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Impuesto de Seguros'"
        order: _lineNumber
  - condition: _pol.periodicity=="s"
    name: 2 Installments / SemiAnnual
    dueDaysFirstInstallment: 0
    maxInstallments: 2
    defaultInstallments: 2
    defaultPremiumPeriodicity: s
    Detail:
      - condition: _installment.numberInYear < 2
        amount: /*block*/ doCmd({cmd:'ExeChain', data:{chain:'cmdGetModalPremiumCoverageInstallment', context:'{policyId:'+ _pol.id +',anualPremium:'+ _pol.anualPremium +',frequency:"' + _pol.periodicity + '"}'}}); Math.round(ExeChain.outData*100)/100;
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Prima Cobertura'"
        order: _lineNumber
      - condition: _installment.numberInYear < 2
        amount: Math.round(_pol.tax/2*100)/100;
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Impuesto de Seguros'"
        order: _lineNumber
      - condition: _installment.numberInYear == 2
        amount: /*block*/ doCmd({cmd:'ExeChain', data:{chain:'cmdGetModalPremiumCoverageInstallment', context:'{policyId:'+ _pol.id +',anualPremium:'+ _pol.anualPremium +',frequency:"' + _pol.periodicity + '", isPremiumFactor:true}'}}); Math.round(ExeChain.outData*100)/100;
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Prima Cobertura'"
        order: _lineNumber
      - condition: _installment.numberInYear == 2
        amount: Math.round(((Math.round(_pol.tax/2*100)/100)+(_pol.tax-((Math.round(_pol.tax/2*100)/100)*2)))*100)/100;
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Impuesto de Seguros'"
        order: _lineNumber
  - condition: _pol.periodicity=="y"
    name: 1 Installments / Annual
    dueDaysFirstInstallment: 0
    maxInstallments: 1
    defaultInstallments: 1
    defaultPremiumPeriodicity: y
    Detail:
      - condition: 1==1
        amount: /*block*/ doCmd({cmd:'ExeChain', data:{chain:'cmdGetModalPremiumCoverageInstallment', context:'{policyId:'+ _pol.id +',anualPremium:'+ _pol.anualPremium +',tax:'+ _pol.tax +',frequency:"' + _pol.periodicity + '"}'}}); Math.round(ExeChain.outData*100)/100;
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Prima Cobertura'"
        order: _lineNumber
   #   - condition: 1==1
   #     amount: Math.round(_pol.fee/1*100)/100;
   #     concept: "'Detalle de cuota #'+_installment.numberInYear"
   #     detail: "'Fees'"
   #     order: _lineNumber
      - condition: 1==1
        amount: Math.round(_pol.tax/1*100)/100;
        concept: "'Detalle de cuota #'+_installment.numberInYear"
        detail: "'Impuesto de Seguros'"
        order: _lineNumber
  - condition: _pol.periodicity=="m2" || _pol.periodicity=="b"
