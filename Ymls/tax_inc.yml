Rules:
  - name: Impuesto de Seguros
    amount: |-
      /*block*/
      /* MSN-000006: punto unico de calculo. Toda la logica vive en la cadena
         cmdCalculateGeneralTax; esta regla solo toma su parte del resultado. */
      doCmd({cmd:"ExeChain",data:{chain:"cmdCalculateGeneralTax",
      context:JSON.stringify({
        action:"QUOTE",
        policyId:_pol.id,
        lob:_pol.lob,
        anualPremium:_pol.anualPremium,
        policyTax:_pol.tax,
        effectiveDate:(_change&&_change.effectiveDate)?_change.effectiveDate:"",
        changeAdditional:(_change&&_change.jAdditional)?String(_change.jAdditional):((_pol.jChangeDto&&_pol.jChangeDto.data&&_pol.jChangeDto.data.jAdditional)?String(_pol.jChangeDto.data.jAdditional):""),
        coinsurance:(_pol&&_pol.CoinsuranceCessions)?_pol.CoinsuranceCessions:[]
      })
      }});
      Number(Number((ExeChain&&ExeChain.ok&&ExeChain.outData)?ExeChain.outData.iva:0).toFixed(2))
    condition: 1==1
    event: QUOTE

  - name: Impuesto Coaseguro
    amount: |-
      /*block*/
      /* MSN-000006: punto unico de calculo. Toda la logica vive en la cadena
         cmdCalculateGeneralTax; esta regla solo toma su parte del resultado. */
