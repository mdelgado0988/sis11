      context:JSON.stringify({
        action:"QUOTE",
        policyId:_pol.id,
        lob:_pol.lob,
        anualPremium:_pol.anualPremium,
        policyTax:_pol.tax,
        effectiveDate:(_change&&_change.effectiveDate)?_change.effectiveDate:"",
        changeAdditional:(_change&&_change.jAdditional)?String(_change.jAdditional):((_pol.jChangeDto&&_pol.jChangeDto.data&&_pol.jChangeDto.data.jAdditional)?String(_pol.jChangeDto.data.jAdditional):""),
        coinsurance:(_pol&&_pol.CoinsuranceCessions)?_pol.CoinsuranceCessions:[]
      })
      }});
      Number(Number((ExeChain&&ExeChain.ok&&ExeChain.outData)?ExeChain.outData.icoa:0).toFixed(2))
    condition: |-
      /*block*/
      /* MSN-000006: el renglon ICOA solo existe cuando hay coasegurador con rol de
         banco en un ramo de Fianzas. El modo CHECK responde eso sin calcular totales. */
      doCmd({cmd:"ExeChain",data:{chain:"cmdCalculateGeneralTax",
      context:JSON.stringify({
        action:"QUOTE",
        mode:"CHECK",
        policyId:_pol.id,
        lob:_pol.lob,
        anualPremium:_pol.anualPremium,
        policyTax:_pol.tax,
        effectiveDate:(_change&&_change.effectiveDate)?_change.effectiveDate:"",
        changeAdditional:(_change&&_change.jAdditional)?String(_change.jAdditional):((_pol.jChangeDto&&_pol.jChangeDto.data&&_pol.jChangeDto.data.jAdditional)?String(_pol.jChangeDto.data.jAdditional):""),
        coinsurance:(_pol&&_pol.CoinsuranceCessions)?_pol.CoinsuranceCessions:[]
      })
      }});
      ((ExeChain&&ExeChain.ok&&ExeChain.outData)?ExeChain.outData.applies:false)===true
    event: QUOTE

  - name: Impuesto de Auto
    amount: |-
      /*block*/
