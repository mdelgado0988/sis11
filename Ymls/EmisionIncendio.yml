scanCommand:  
  cmd: ExeChain
  data:
    chain: cmdEmisionIncendioContext
    context: "{id:_id,tipo:_tipo}" 
unique: _unique
reference: _reference
status: 1
code: _code
description: _description
entity: "LifePolicy"
entityId: _Policy.id
Lines:
# EMISION
#Primas
  - account: _cuentaPrimaxCobrar
    debit: '_primaPorCobrar > 0 ? _primaPorCobrar : 0'
    credit: '_primaPorCobrar < 0 ? -_primaPorCobrar : 0'
    comments: "'Primas por cobrar correspondientes al mes de '+ _anioMes"
    order: _lineNumber
    condition: _primaPorCobrar != 0 && (!_cancelacion)
  - account: _cuentaPrima
    debit: '_prima < 0 ? -_prima : 0'
    credit: '_prima > 0 ? _prima : 0'
    comments: "'Primas emitidas (suscritas) del mes de ' + _anioMes"
    order: _lineNumber
    condition: _prima != 0 && (!_cancelacion)
  - account: _cuentaImpuestoPrimas
    debit: '_impuestoPrimasIncendio < 0 ? -_impuestoPrimasIncendio : 0'
    credit: '_impuestoPrimasIncendio > 0 ? _impuestoPrimasIncendio : 0'
    comments: "'Impuesto sobre primas emitidas ' + _anioMes"
    order: _lineNumber
    condition: _impuestoPrimasIncendio != 0 && (!_cancelacion)
  - account: _cuentaCoaseguro
    debit: '_coaseguroPorPagar < 0 ? -_coaseguroPorPagar : 0'
    credit: '_coaseguroPorPagar > 0 ? _coaseguroPorPagar : 0'
    comments: "'Coaseguro por pagar de ' + _anioMes"
    order: _lineNumber
    condition: _coaseguroPorPagar != 0 && (!_cancelacion)
# Impuestos.    
  - account: _cuentaGastosPrimas
    debit: '_gastoPrimaIncendio > 0 ? _gastoPrimaIncendio : 0'
    credit: '_gastoPrimaIncendio < 0 ? -_gastoPrimaIncendio : 0'
    comments: "'Gasto de impuesto 2% de primas de ' + _anioMes"
    order: _lineNumber
    condition: _gastoPrimaIncendio != 0 && (!_cancelacion)
  - account: _cuentaDaniosxPagar
    debit: '_daniosPorPagar < 0 ? -_daniosPorPagar : 0'
    credit: '_daniosPorPagar > 0 ? _daniosPorPagar : 0'
    comments: "'Impuesto sobre primas emitidas de ' + _anioMes"
    order: _lineNumber
    condition: _daniosPorPagar != 0 && (!_cancelacion)
# Comisiones Agentes.    
  - account: _cuentaComision
    debit: '_commisiones > 0 ? _commisiones : 0'
    credit: '_commisiones < 0 ? -_commisiones : 0'
    comments: "'Honorarios de corredores de seguros ' + _anioMes"
    order: _lineNumber
    condition: _reservasPorPagar != 0 && (!_cancelacion)
  - account: _cuentaReservasxPagar
    debit: '_reservasPorPagar < 0 ? -_reservasPorPagar : 0'
