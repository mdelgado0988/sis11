    comments: "'Honorarios de corredores de seguros ' + _anioMes"
    order: _lineNumber
    condition: _commisiones != 0 && (!_cancelacion)
# Reaseguro.
  - account: _cuentaReaseguroCedido
    debit: '_reaseguroCedido > 0 ? _reaseguroCedido : 0'
    credit: '_reaseguroCedido < 0 ? -_reaseguroCedido : 0'
    comments: "'Primas cedidas del mes de '+ _anioMes"
    order: _lineNumber
    condition: _reaseguroCedido != 0 && (!_cancelacion)
  - account: _cuentaReaseguroComision
