    credit: '_reaseguroComision > 0 ? _reaseguroComision : 0'
    comments: "'Comisiones por cesion de primas de ' + _anioMes"
    order: _lineNumber
    condition: _reaseguroComision != 0 && (!_cancelacion)
  - account: _cuentaReaseguroxPagar
