nonTechnicalPremium: 0
Calculations:
  - name: cfg
    formula: |
      //block
      return { pret: 0.10, pcp: 0.90, pcomi: 0.35, ptax: 0.02 }
  - name: acc
    formula: |
      //block
      //noreplace
      const contextDTO = JSON.stringify({
        pol: context.pol,
        cov: context.cov,
        contrato: "CPCAR",
        productCode: context.pol?.productCode,
        pret: context.cfg.pret
      });
      const resultado = doCmd({ cmd: "ExeChain", data: { chain: "cmdCoverageAccumulationSum", context: contextDTO } });
      if (!resultado?.ok) throw new Error(resultado?.msg || "No fue posible calcular la acumulación CPCAR");
      return resultado.outData;
Lines:
  - ced: _acc.ced;
    re: _acc.re;
    cedantPremium: _acc.cedantPremium;
    reinsurerPremium: _acc.reinsurerPremium;
    commission: +(_acc.reinsurerPremium * _cfg.pcomi).toFixed(2);
    tax: +(_acc.reinsurerPremium * _cfg.ptax).toFixed(2);
    id: Cuota Parte

  - condition: _acc.sumaFac != 0
    ced: 0;
    re: _acc.sumaFac;
    cedantPremium: 0;
    reinsurerPremium: _acc.primaFac;
    commission: 0;
    tax: +(_acc.primaFac * _cfg.ptax).toFixed(2);
    id: FAC
